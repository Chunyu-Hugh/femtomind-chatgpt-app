<style>
  :root {
    --bg: #ffffff; --fg: #0b0d12; --muted: #5b6472; --line: #e3e7ee;
    --panel: #f7f9fc; --accent: #2f6fed; --rep: rgba(47,111,237,.28);
    --mean: #0b3aa3; --warn: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --fg: #e6e9ef; --muted: #98a2b3; --line: #232a35;
      --panel: #151a22; --accent: #5b8cff; --rep: rgba(91,140,255,.30);
      --mean: #a9c4ff; --warn: #d9a441;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { padding: 14px 16px 18px; }
  .hd { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .hd h2 { font-size: 15px; margin: 0; font-weight: 650; }
  .hd .q { color: var(--muted); font-size: 13px; }
  .sub { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
  .mock { color: var(--warn); font-size: 12px; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 4px; }
  .panel .t { font-size: 12.5px; font-weight: 600; margin: 2px 4px 2px; }
  svg { width: 100%; height: auto; display: block; }
  .err { color: var(--warn); font-size: 13px; }
</style>

<div class="wrap">
  <div class="hd"><h2 id="title">Replica PDFs</h2><span class="q" id="q2"></span></div>
  <p class="sub" id="sub"></p>
  <p class="mock" id="mockNote" style="display:none"></p>
  <div class="grid" id="grid"></div>
  <div class="err" id="err"></div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const MAX_REP = 80; // cap drawn replicas for performance

  const FLAVOR_LABEL = {
    g: "gluon  x·g(x)", u: "up  x·u(x)", d: "down  x·d(x)",
    s: "strange  x·s(x)", ub: "ū  x·ū(x)", db: "d̄  x·d̄(x)",
    uv: "u valence", dv: "d valence",
  };

  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  const log10 = (v) => Math.log10(v);

  function decadeTicks(lo, hi) {
    const t = [];
    for (let e = Math.floor(log10(lo)); e <= Math.ceil(log10(hi)); e++) t.push(Math.pow(10, e));
    return t.filter((v) => v >= lo * 0.999 && v <= hi * 1.001);
  }
  function fmtTick(v) {
    const e = Math.round(log10(v));
    if (e === 0) return "1";
    if (e === 1) return "10";
    return "10" + String(e).replace(/-/g, "⁻").replace(/0/g,"⁰").replace(/1/g,"¹").replace(/2/g,"²").replace(/3/g,"³").replace(/4/g,"⁴").replace(/5/g,"⁵");
  }

  function drawPanel(flavor, x, curves, panelState) {
    const W = 360, H = 250, m = { l: 46, r: 10, t: 10, b: 32 };
    const pw = W - m.l - m.r, ph = H - m.t - m.b;
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("role", "img");

    // sample replicas
    const drawn = curves.length > MAX_REP
      ? curves.filter((_, i) => i % Math.ceil(curves.length / MAX_REP) === 0)
      : curves;

    // x domain (x_grid is increasing, log-spaced)
    const xmin = x[0] > 0 ? x[0] : 1e-4, xmax = x[x.length - 1];

    // y domain from drawn values
    let minPos = Infinity, minV = Infinity, maxV = -Infinity;
    for (const c of drawn) for (const v of c) {
      if (!isFinite(v)) continue;
      if (v < minV) minV = v; if (v > maxV) maxV = v;
      if (v > 0 && v < minPos) minPos = v;
    }
    if (!isFinite(maxV)) { el("text", { x: m.l, y: m.t + 16, fill: "var(--warn)", "font-size": 11 }, svg).textContent = "no data"; return svg; }
    const wantLog = (panelState && panelState.y_log !== false);
    const ylog = wantLog && isFinite(minPos) && maxV > 0 && maxV / minPos > 30;
    let ylo, yhi;
    if (ylog) { yhi = maxV * 1.15; ylo = Math.max(minPos, maxV / 3e3); }
    else { const pad = (maxV - minV) * 0.08 || 0.1; ylo = minV - pad; yhi = maxV + pad; }

    const sx = (v) => m.l + (log10(Math.min(Math.max(v, xmin), xmax)) - log10(xmin)) / (log10(xmax) - log10(xmin)) * pw;
    const sy = ylog
      ? (v) => m.t + (1 - (log10(Math.min(Math.max(v, ylo), yhi)) - log10(ylo)) / (log10(yhi) - log10(ylo))) * ph
      : (v) => m.t + (1 - (Math.min(Math.max(v, ylo), yhi) - ylo) / (yhi - ylo)) * ph;

    // grid + axes
    for (const tx of decadeTicks(xmin, xmax)) {
      const X = sx(tx);
      el("line", { x1: X, y1: m.t, x2: X, y2: m.t + ph, stroke: "var(--line)", "stroke-width": 1 }, svg);
      el("text", { x: X, y: H - 12, fill: "var(--muted)", "font-size": 10, "text-anchor": "middle" }, svg).textContent = fmtTick(tx);
    }
    const yticks = ylog ? decadeTicks(ylo, yhi) : (() => { const a = []; for (let i = 0; i <= 4; i++) a.push(ylo + (yhi - ylo) * i / 4); return a; })();
    for (const ty of yticks) {
      const Y = sy(ty);
      el("line", { x1: m.l, y1: Y, x2: m.l + pw, y2: Y, stroke: "var(--line)", "stroke-width": 1 }, svg);
      el("text", { x: m.l - 5, y: Y + 3, fill: "var(--muted)", "font-size": 10, "text-anchor": "end" },
        svg).textContent = ylog ? fmtTick(ty) : (Math.abs(ty) >= 100 || (ty !== 0 && Math.abs(ty) < 0.01) ? ty.toExponential(1) : ty.toFixed(2));
    }
    // frame
    el("rect", { x: m.l, y: m.t, width: pw, height: ph, fill: "none", stroke: "var(--line)", "stroke-width": 1 }, svg);
    // x label
    el("text", { x: m.l + pw / 2, y: H - 1, fill: "var(--muted)", "font-size": 10.5, "text-anchor": "middle" }, svg).textContent = "x";

    const pts = (curve) => {
      let s = "";
      for (let i = 0; i < curve.length; i++) {
        const v = curve[i];
        if (!isFinite(v)) continue;
        s += (s ? " " : "") + sx(x[i]).toFixed(1) + "," + sy(v).toFixed(1);
      }
      return s;
    };
    // replicas
    for (const c of drawn) el("polyline", { points: pts(c), fill: "none", stroke: "var(--rep)", "stroke-width": 0.7 }, svg);
    // mean
    const mean = x.map((_, i) => {
      let s = 0, n = 0;
      for (const c of drawn) { if (isFinite(c[i])) { s += c[i]; n++; } }
      return n ? s / n : NaN;
    });
    el("polyline", { points: pts(mean), fill: "none", stroke: "var(--mean)", "stroke-width": 1.8 }, svg);
    return svg;
  }

  function render(out) {
    if (!out || !out.curves_inline) { $("err").textContent = "No plot data received."; return; }
    // A good render clears any earlier error/mock banner — a transient
    // "No plot data received" must not sit under a live plot forever.
    $("err").textContent = "";
    $("mockNote").style.display = "none";
    const ci = out.curves_inline;
    const params = (out.spec && out.spec.params) || {};
    const panelState = (out.spec && out.spec.panel_state) || {};
    const x = ci.x_grid || [];
    const cbf = ci.curves_by_flavor || {};
    const flavors = ci.flavors || Object.keys(cbf);
    const nrep = (ci.replica_ids && ci.replica_ids.length) ||
      (flavors[0] && cbf[flavors[0]] ? cbf[flavors[0]].length : 0);

    $("title").textContent = (params.dist ? params.dist.toUpperCase() : "PDF") + " replicas";
    $("q2").textContent = params.q2 ? `Q² = ${params.q2} GeV²` : "";
    $("sub").textContent = `${flavors.length} flavor${flavors.length === 1 ? "" : "s"} · ${nrep} replica${nrep === 1 ? "" : "s"}` +
      (nrep > MAX_REP ? ` (showing ${MAX_REP})` : "");
    if (out.mock) {
      $("mockNote").style.display = "block";
      $("mockNote").textContent = "⚠ Example curves — " +
        (out.backend_note || "no completed fit yet") +
        ". Real replica PDFs render here once a fit finishes on the cluster.";
    }

    const grid = $("grid"); grid.innerHTML = "";
    if (!x.length || !flavors.length) { $("err").textContent = "Plot payload is empty."; return; }
    for (const f of flavors) {
      const curves = cbf[f] || [];
      const panel = document.createElement("div"); panel.className = "panel";
      const t = document.createElement("div"); t.className = "t";
      t.textContent = FLAVOR_LABEL[f] || f;
      panel.appendChild(t);
      panel.appendChild(drawPanel(f, x, curves, panelState));
      grid.appendChild(panel);
    }
  }

  // The host may hand over the bare result or an MCP CallToolResult wrapper
  // ({structuredContent} / {result} / {content:[{text:JSON}]}), and it may fill
  // toolOutput only AFTER this script runs. Unwrap all shapes and repaint on
  // arrival, otherwise a perfectly good payload renders as "no plot data".
  function unwrap(res) {
    let v = res;
    for (let i = 0; i < 4 && v && typeof v === "object"; i++) {
      if (v.curves_inline) return v;
      if (v.structuredContent) { v = v.structuredContent; continue; }
      if (v.result) { v = v.result; continue; }
      if (Array.isArray(v.content)) {
        const t = v.content.find(c => c && typeof c.text === "string");
        if (t) { try { v = JSON.parse(t.text); continue; } catch (e) {} }
      }
      break;
    }
    return v;
  }
  function paint() {
    const raw = window.openai && window.openai.toolOutput;
    if (!raw) return false;
    const v = unwrap(raw);
    // The host broadcasts the latest tool output for EVERY call in the
    // conversation. Only repaint when the payload is actually this tool's
    // plot shape, otherwise a follow-up tool call (e.g. list_campaigns)
    // would overwrite a perfectly good render with "No plot data received".
    if (v && v.curves_inline) { render(v); return true; }
    return true;   // payload exists but is not ours — keep the current plot
  }
  if (!paint()) {
    render(null);
    // late delivery: keep looking briefly instead of leaving an empty card
    let tries = 0;
    const iv = setInterval(() => { if (paint() || ++tries > 20) clearInterval(iv); }, 250);
  }
  window.addEventListener("message", (m) => {
    if (m.data && m.data.type === "openai:set_globals") paint();
  });
})();
</script>
