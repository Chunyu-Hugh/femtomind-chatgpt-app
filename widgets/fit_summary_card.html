<!doctype html>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font: 13px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
         color: #1a1a1a; background: transparent; }
  @media (prefers-color-scheme: dark) { body { color: #ececec; } }
  .wrap { padding: 14px 16px; }
  .title { font-size: 14px; font-weight: 650; margin-bottom: 2px; }
  .sub { font-size: 12px; opacity: .6; margin-bottom: 12px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
           gap: 8px; margin-bottom: 12px; }
  .tile { border: 1px solid rgba(128,128,128,.22); border-radius: 10px; padding: 8px 10px; }
  .tile .v { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tile .k { font-size: 11px; opacity: .6; margin-top: 1px; }
  .good .v { color: #0c7a40; } .warn .v { color: #a06600; }
  @media (prefers-color-scheme: dark) { .good .v { color: #4ade80; } .warn .v { color: #fbbf24; } }
  .sec { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; opacity: .55; margin: 10px 0 4px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 4px 8px 4px 0; border-bottom: 1px solid rgba(128,128,128,.12);
       font-variant-numeric: tabular-nums; }
  .empty { opacity: .6; padding: 10px 0; }
</style>
<div class="wrap">
  <div class="title">Fit quality summary</div>
  <div class="sub" id="sub"></div>
  <div id="body"><div class="empty">Waiting for summary…</div></div>
</div>
<script>
  const esc = (s) => String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const fmt = (x, d) => (x === null || x === undefined || isNaN(+x)) ? '—' : (+x).toFixed(d);
  function pick(o, keys) { for (const k of keys) if (o && o[k] !== undefined && o[k] !== null) return o[k]; }

  function render(out) {
    if (!out) return;
    // The host broadcasts tool results for EVERY call in the conversation.
    // Only paint payloads shaped like a fit summary, so an unrelated result
    // (jobs list, campaign list…) can never clobber a valid summary card.
    if (!out.result && !out.summary && !out.process_table && !out.per_idx
        && !out.replica_spread && out.error === undefined && out.status === undefined) return;
    // The payload the backend actually returns. This card was written against
    // a shape that never existed — it looked for chi2_per_point, n_replicas,
    // mean_global_z and top_tension_datasets, none of which the summary has
    // ever carried — so it could not render a single result and sat on its
    // placeholder forever. The real keys are below; the old ones are still
    // accepted in case an older backend is on the other end.
    const s = out.result || out.summary || out;
    const table = s.process_table || [];
    const total = table.find(r => String(r.process).toUpperCase() === 'TOTAL') || table[table.length - 1] || {};
    const chi2  = pick(total, ['chi2_red']) ?? pick(s, ['chi2_per_point', 'chi2ppt', 'chi2']);
    const zscore= pick(total, ['z_score'])  ?? pick(s, ['mean_global_z', 'mean_z_score']);
    const npts  = pick(total, ['N_dat'])    ?? pick(s, ['n_points', 'total_points']);
    const nrep  = pick(s, ['n_survivors', 'completed_replicas', 'n_replicas']);
    const ntot  = pick(s, ['n_total']);
    const batch = pick(out, ['batch_id']) || pick(s, ['batch_id']) || '';
    document.getElementById('sub').textContent = batch ? ('batch ' + batch) : '';

    const body = document.getElementById('body');
    if (chi2 === undefined && nrep === undefined) {
      body.innerHTML = '<div class="empty">' +
        (out.error ? esc(String(out.error).slice(0, 200))
         : out.status === 'computing'
           ? 'Computing on the cluster — ask again in a few minutes.'
           : 'Summary not ready yet — the batch may still be running.') + '</div>';
      return;
    }

    // A reduced chi-square is not "good" below 1.3 in a global fit; 1 is the
    // target and anything past ~2 is a real tension, so flag on that instead.
    const chi2cls = chi2 === undefined ? '' : (+chi2 < 1.5 ? 'good' : 'warn');
    const repTxt = (nrep ?? '—') + (ntot && ntot !== nrep
      ? ' <span style="font-size:12px;opacity:.6">of ' + ntot + '</span>' : '');
    let html = '<div class="tiles">' +
      '<div class="tile ' + chi2cls + '"><div class="v">' + fmt(chi2, 2) + '</div><div class="k">&#967;&#178; / point</div></div>' +
      '<div class="tile"><div class="v">' + repTxt + '</div><div class="k">replicas</div></div>' +
      '<div class="tile"><div class="v">' + fmt(zscore, 1) + '</div><div class="k">global Z</div></div>' +
      '<div class="tile"><div class="v">' + (npts ?? '—') + '</div><div class="k">data points</div></div>' +
      '</div>';

    // An ensemble can report every replica as passing and still contain one
    // that landed far outside the rest. That is the first thing to say.
    const sp = out.replica_spread || s.replica_spread;
    if (sp && sp.warning) {
      html += '<div class="sec" style="color:#b0560a">Ensemble</div>' +
        '<div style="font-size:12px;opacity:.85">' + esc(String(sp.warning).slice(0, 240)) + '</div>';
      if (sp.chi2_npts_median !== undefined) {
        html += '<div style="font-size:12px;opacity:.7;margin-top:3px">&#967;&#178;/pt across replicas: '
             + fmt(sp.chi2_npts_min, 2) + ' &ndash; ' + fmt(sp.chi2_npts_max, 2)
             + ' (median ' + fmt(sp.chi2_npts_median, 2) + ')</div>';
      }
    }

    // Per-dataset rows, worst first: this is where a tension is actually read.
    const rows = (s.per_idx || s.top_tension_datasets || s.tension || []).slice();
    if (Array.isArray(rows) && rows.length) {
      rows.sort((a, b) => (pick(b, ['z_score', 'z']) ?? 0) - (pick(a, ['z_score', 'z']) ?? 0));
      html += '<div class="sec">Datasets, worst tension first</div><table>' +
        rows.slice(0, 6).map(t => {
          const name = (t.col ? t.col + ' ' : '') + (t.obs || '') + (t.tar ? ' (' + t.tar + ')' : '')
                       || t.dataset || t.id || t.name || '';
          const z = pick(t, ['z_score', 'zscore', 'z']);
          const c = pick(t, ['chi2_red', 'chi2_per_point', 'chi2']);
          const n = pick(t, ['npts', 'N_dat']);
          const cls = (c !== undefined && +c > 2) ? ' style="color:#b0560a"' : '';
          return '<tr><td>' + esc(name) + '</td><td>' + esc(n ?? '—') + ' pts</td>'
               + '<td' + cls + '>&#967;&#178;/pt ' + fmt(c, 2) + '</td>'
               + '<td' + cls + '>Z ' + fmt(z, 1) + '</td></tr>';
        }).join('') + '</table>';
    }
    body.innerHTML = html;
  }

  if (window.openai && window.openai.toolOutput) render(window.openai.toolOutput);
  window.addEventListener('message', (ev) => {
    const m = ev.data;
    if (!m || typeof m !== 'object') return;
    if (m.method === 'ui/notifications/tool-result') {
      render(m.params && (m.params.structuredContent || m.params));
    }
    if (m.type === 'openai:set_globals' && window.openai && window.openai.toolOutput) {
      render(window.openai.toolOutput);
    }
  });
</script>
