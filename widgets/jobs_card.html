<!doctype html>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font: 13px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
         color: #1a1a1a; background: transparent; }
  @media (prefers-color-scheme: dark) { body { color: #ececec; } }
  .wrap { padding: 14px 16px; }
  .hdr { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  .title { font-size: 14px; font-weight: 650; }
  .count { opacity: .65; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
       opacity: .55; padding: 4px 8px 4px 0; border-bottom: 1px solid rgba(128,128,128,.25); }
  td { padding: 5px 8px 5px 0; border-bottom: 1px solid rgba(128,128,128,.12);
       font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.name { max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
  .state { display: inline-block; padding: 1px 7px; border-radius: 9px; font-size: 11px; font-weight: 600; }
  .state.R  { background: rgba(16,150,80,.15);  color: #0c7a40; }
  .state.PD { background: rgba(200,140,0,.15);  color: #a06600; }
  .state.other { background: rgba(128,128,128,.15); }
  @media (prefers-color-scheme: dark) {
    .state.R { color: #4ade80; } .state.PD { color: #fbbf24; }
  }
  .empty { opacity: .6; padding: 14px 0; }
  .raw { margin-top: 8px; font: 11px/1.4 ui-monospace, monospace; white-space: pre-wrap;
         opacity: .7; max-height: 130px; overflow: auto; display: none; }
</style>
<div class="wrap">
  <div class="hdr">
    <span class="title">SLURM queue · JLab HPC</span>
    <span class="count" id="count"></span>
  </div>
  <div id="body"><div class="empty">Waiting for job data…</div></div>
  <div class="raw" id="raw"></div>
</div>
<script>
  const esc = (s) => String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  function render(out) {
    if (!out) return;
    // The host broadcasts tool results for EVERY call in the conversation.
    // Only paint payloads that are actually this tool's shape, so an
    // unrelated result can never wipe a live queue table.
    if (!Array.isArray(out.jobs) && out.error === undefined && out.raw === undefined) return;
    const jobs = out.jobs || [];
    const body = document.getElementById('body');
    document.getElementById('count').textContent =
      jobs.length ? jobs.length + ' job' + (jobs.length > 1 ? 's' : '') : '';
    if (!jobs.length) {
      body.innerHTML = '<div class="empty">Queue is empty' +
        (out.error ? ' — ' + esc(String(out.error).slice(0, 160)) : '') + '</div>';
      const raw = document.getElementById('raw');
      if (out.raw) { raw.textContent = out.raw; raw.style.display = 'block'; }
      return;
    }
    const cls = s => s === 'R' ? 'R' : (s === 'PD' ? 'PD' : 'other');
    body.innerHTML = '<table><thead><tr>' +
      '<th>Job</th><th>Name</th><th>User</th><th>State</th><th>Time</th><th>Left</th>' +
      '</tr></thead><tbody>' +
      jobs.map(j => {
        const name = esc(j.name || '—');
        return '<tr><td>' + esc(j.job_id) + '</td><td class="name" title="' + name + '">' + name +
          '</td><td>' + esc(j.user) + '</td><td><span class="state ' + cls(j.state) + '">' + esc(j.state) +
          '</span></td><td>' + esc(j.time) + '</td><td>' + esc(j.time_left || '—') + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  // Primary: ChatGPT host bridge exposes the tool output directly.
  if (window.openai && window.openai.toolOutput) render(window.openai.toolOutput);
  // Also honor the standard MCP-Apps notification flow (and host updates).
  window.addEventListener('message', (ev) => {
    const m = ev.data;
    if (!m || typeof m !== 'object') return;
    if (m.method === 'ui/notifications/tool-result') {
      const sc = m.params && (m.params.structuredContent || m.params);
      render(sc);
    }
    if (m.type === 'openai:set_globals' && window.openai && window.openai.toolOutput) {
      render(window.openai.toolOutput);
    }
  });
</script>
