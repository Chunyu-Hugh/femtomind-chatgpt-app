# Parameter explanations for PDF computation
# This file contains explanations for all parameters in the YAML configuration

# Top-level configuration parameters
parameters:
  "grid path":
    description: "Path to the grid files directory"
    type: "string"
    default: "grids"
  
  "ftol":
    description: "Tolerance for fit convergence"
    type: "float"
    default: 1.0e-06
  
  "bootstrap":
    description: "Enable bootstrap resampling"
    type: "boolean"
    default: false
  
  "flat par":
    description: "Use flat parameter initialization"
    type: "boolean"
    default: false
  
  "dglap mode":
    description: "DGLAP evolution mode (truncated, etc.)"
    type: "string"
    default: "truncated"
  
  "alphaSmode":
    description: "Alpha_s evolution mode (backward/forward)"
    type: "string"
    default: "backward"
    options: ["backward", "forward"]
  
  "order":
    description: "Perturbative order (LO/NLO/NNLO)"
    type: "string"
    default: "NLO"
    options: ["LO", "NLO", "NNLO"]
  
  "Q20":
    description: "Initial scale squared (Q^2_0) in GeV^2"
    type: "float"
    default: 1.6129
  
  "nuc":
    description: "Enable nuclear corrections"
    type: "boolean"
    default: true
  
  "tmc":
    description: "Target mass correction scheme (AOT/none)"
    type: "string"
    default: "AOT"
    options: ["AOT", "none"]
  
  "ht":
    description: "Enable higher-twist corrections"
    type: "boolean"
    default: false
  
  "ht type":
    description: "Higher-twist correction type"
    type: "string"
    default: "mult"
  
  "offpdf":
    description: "Enable off-shell PDF effects"
    type: "boolean"
    default: false

# Dataset parameters (for idis workflow)
datasets:
  idis:
    description: "IDIS (Inclusive Deep Inelastic Scattering) dataset configuration"
    
    filters:
      description: "Data filtering conditions (e.g., Q2>1.69, W2>10.0)"
      type: "list of strings"
      example: ["Q2>1.69", "W2>10.0"]
    
    xlsx:
      description: "Mapping of dataset indices to Excel file paths"
      type: "dictionary"
      note: "Dataset indices correspond to experiments listed in database/idis/README.md"
    
    norm:
      description: "Normalization parameters for each dataset"
      type: "dictionary"
      structure:
        value: "Normalization value (typically around 1.0)"
        min: "Minimum allowed value"
        max: "Maximum allowed value"
        fixed: "Whether the normalization is fixed (true) or free (false)"

# PDF parameters (read-only for now)
pdf_params:
  description: "PDF functional form parameters"
  note: "These parameters define the PDF functional form and are typically not modified by users in the chatbot interface"

  # --- JAM25 pion/kaon ladder parameters (L2 from-scratch reproduction) ---
  "pdf-pion ubv1 a":
    description: "Pion valence quark small-x exponent. Flat-prior range [-1.0, 0.9]; constrained by DY data."
    type: "float"
  "pdf-pion ubv1 b":
    description: "Pion valence quark large-x falloff exponent (1-x)^b. Constrained by DY at x>0.2."
    type: "float"
  "pdf-pion ubv1 c":
    description: "Pion valence subleading-shape coefficient (1+c x^d)."
    type: "float"
  "pdf-pion ubv1 d":
    description: "Pion valence subleading-shape exponent."
    type: "float"
  "pdf-pion u1 a":
    description: "Pion sea quark small-x exponent. Physics prior [-1,0]: sea not more singular than valence."
    type: "float"
  "pdf-pion u1 b":
    description: "Pion sea quark large-x falloff. Physics prior [4,12]: sea steep at large x (unconstrained by data)."
    type: "float"
  "pdf-pion g1 N":
    description: "Pion gluon normalization. Fixed in step 1 (DY alone cannot constrain the gluon), freed from step 2 (LN data)."
    type: "float"
  "pdf-pion g1 a":
    description: "Pion gluon small-x exponent."
    type: "float"
  "pdf-pion g1 b":
    description: "Pion gluon large-x falloff. Physics prior [4,12]."
    type: "float"
  "p->pi,n lambda":
    description: "Cutoff mass of the p->pi+n splitting function for leading-neutron observables (McKenney-Sato model)."
    type: "float"
  "pdf-kaon ubv1 a":
    description: "Kaon ubar-valence small-x exponent. Valence-like prior [-0.5,0.9]: no small-x divergence (NA3 and lattice do not constrain small x)."
    type: "float"
  "pdf-kaon ubv1 b":
    description: "Kaon ubar-valence large-x falloff. Constrained by NA3 ratio and lattice moments."
    type: "float"
  "pdf-kaon sv1 a":
    description: "Kaon strange-valence small-x exponent (valence-like prior)."
    type: "float"
  "pdf-kaon sv1 b":
    description: "Kaon strange-valence large-x falloff."
    type: "float"
  "pdf-kaon u1 N":
    description: "Kaon sea normalization — free (paper: normalizations vary); kaon gluon normalization is fixed by the momentum sum rule."
    type: "float"
  "kaon fitting scenario":
    description: "Sum-rule attribution scheme for the kaon PDF: 6 = sea N free, gluon N from kaon momentum sum rule (paper text)."
    type: "integer"
