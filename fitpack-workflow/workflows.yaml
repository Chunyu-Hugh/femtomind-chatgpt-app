- id: idis_fit
  name: PDF Fit (Inclusive DIS)
  description: >-
    Inclusive DIS fitting workflow.
    Select datasets, review PDF parameters, submit batch jobs to SLURM.
  observable: idis
  steps:
    - id: dataset_select
      title: Select Datasets
      description: Choose which Inclusive DIS datasets to include in the fit.
      type: dataset_select
      observable: idis

    - id: review_params
      title: Review Parameters
      description: Review current PDF fitting parameters. Fixed parameters are read-only; others can be modified.
      type: params_review
      tool: get_current_parameters

    - id: job_count
      title: Number of Jobs
      description: How many fitting jobs do you want to run?
      fields:
        - name: count
          type: number
          label: Number of jobs
          default: 10
          min: 1
          max: 100
        - name: job_number
          type: text
          label: Job number prefix
          default: "000"
          description: "Prefix for output directory names"

    - id: mode_select
      title: Sampling Mode
      description: Choose how to generate parameter sets for the fitting jobs.
      type: mode_select
      modes:
        - id: random
          label: Random Sampling
          description: Randomly sample non-fixed parameters within their [min, max] bounds.
          tool: generate_random_tasks
        - id: custom
          label: Custom Parameters
          description: Manually specify parameter values for each job.
          tool: generate_custom_tasks
          per_job_params: true
          job_count_ref: "job_count.count"

    - id: confirm_submit
      title: Confirm & Submit
      description: Review summary and submit all tasks to SLURM.
      tool: submit_batch_tasks
      confirm: true

