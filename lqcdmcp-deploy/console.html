<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JAM Gateway Console</title>
<style>
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
margin:0;background:#f6f7f9;color:#15202b}
.wrap{max-width:860px;margin:0 auto;padding:24px}
h1{font-size:20px;margin:0 0 4px}.sub{color:#5c6774;font-size:13px;margin-bottom:18px}
.card{background:#fff;border:1px solid #e0e4ea;border-radius:12px;padding:18px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px}
label{display:block;font-size:12.5px;font-weight:600;margin:8px 0 3px}
input,select{width:100%;font:inherit;padding:8px 10px;border:1px solid #ccd3dc;
border-radius:8px;box-sizing:border-box}
button{font:inherit;font-weight:600;padding:8px 16px;border:0;border-radius:8px;
background:#1d5fd0;color:#fff;cursor:pointer;margin-top:10px;margin-right:8px}
button.ghost{background:#eef1f5;color:#15202b}
pre{background:#0f1319;color:#e8ecf2;padding:12px;border-radius:8px;font-size:12px;
max-height:300px;overflow:auto;white-space:pre-wrap}
.row{display:flex;gap:10px}.row>div{flex:1}
#st{font-size:13px;color:#1d5fd0;margin-top:8px}
.err{color:#c0392b}
</style></head><body><div class="wrap">
<h1>JAM Gateway Console</h1>
<div class="sub">qcd24s100 &rarr; scilogin &rarr; ifarm &middot; 每步都在这页点选,不用聊天</div>
<div class="card">
<h2>1 &middot; 连接(先只填用户名;链活着就不需要凭证)</h2>
<label>JLab 用户名</label><input id="user" placeholder="chunyu">
<label id="otplab" style="display:none">PIN+OTP(仅当提示需要时)</label>
<input id="otp" style="display:none">
<label id="pwlab" style="display:none">ifarm 密码(仅当提示需要时)</label>
<input id="pw" type="password" style="display:none">
<button onclick="doConnect()">连接</button>
<button class="ghost" onclick="call('check_hpc',{})">检查 HPC</button>
<button class="ghost" onclick="call('list_jam_runs',{})">清点 JAM 工作区</button>
<div id="st"></div>
</div>
<div class="card">
<h2>2 &middot; 提交拟合(向导式点选)</h2>
<div class="hint">选反应 → 选数据集 → 定预算 → 复审提交,全程勾选,无需手填参数。</div>
<button onclick="location.search='?ui=composer'" style="font-size:15px;padding:12px 22px">打开拟合向导(选项式 UI)</button>
<div style="margin-top:14px">
<label>输出目录(用于下面的快捷查看)</label>
<input id="outdir" placeholder="001/step7_claude">
<button class="ghost" onclick="call('get_jam_result',{outdir:val('outdir')})">查状态</button>
<button class="ghost" onclick="call('read_chi2',{outdir:val('outdir')})">读 &chi;²</button>
<button class="ghost" onclick="call('evaluate_fit',{outdir:val('outdir')})">对照论文 band</button>
<button class="ghost" onclick="call('chain_state',{outdir:val('outdir')})">阶梯状态(冻结/继续/重制)</button>
</div>
</div>
<div class="card"><h2>3 &middot; 输出</h2><pre id="out">(点上面任意按钮,结果显示在这里)</pre></div>
</div>
<script>
var sid="";
function val(id){return document.getElementById(id).value.trim();}
function show(id,s){document.getElementById(id).style.display=s?"":"none";}
function setSt(t,c){var e=document.getElementById("st");e.textContent=t;e.className=c||"";}
async function call(tool,args){
  setSt("调用 "+tool+" &hellip;");
  try{
    var hdrs={"Content-Type":"application/json","Accept":"application/json, text/event-stream"};
    if(sid)hdrs["Mcp-Session-Id"]=sid;
    var r=await fetch(location.pathname,{method:"POST",headers:hdrs,
      body:JSON.stringify({jsonrpc:"2.0",id:Date.now()%100000,method:"tools/call",
      params:{name:tool,arguments:args}})});
    var h=r.headers.get("Mcp-Session-Id"); if(h)sid=h;
    var d=await r.json();
    var t=(d.result&&d.result.content)?d.result.content.map(function(c){return c.text||"";}).join("\n"):JSON.stringify(d,null,1);
    document.getElementById("out").textContent=t;
    setSt("完成 "+tool,"");
    return t;
  }catch(e){setSt("失败: "+e,"err");document.getElementById("out").textContent=String(e);}
}
async function doConnect(){
  var u=val("user"); if(!u){setSt("先填用户名","err");return;}
  var t=await call("connect_hpc",{username:u});
  if(t&&t.indexOf("need pin_otp")>=0){
    show("otplab",true);show("otp",true);show("pwlab",true);show("pw",true);
    setSt("链不活 &mdash; 需要凭证,填 PIN+OTP 和密码后再点一次连接","err");
  } else if(t&&t.indexOf("reused")>=0){setSt("链已复用,无需凭证");}
  else if(val("otp")&&val("pw")){
    await call("connect_hpc",{username:u,pin_otp:val("otp"),password:val("pw")});
  }
}
async function submitFit(){
  await call("submit_jam_fit",{card:val("card"),outdir:val("outdir"),prior_msr:val("prior"),
    cores:parseInt(val("cores")||"4"),hours:parseInt(val("hours")||"10"),partition:val("part")});
}
</script></body></html>
