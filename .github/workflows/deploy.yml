name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The private key is stored as a repo secret (AWS_SSH_KEY) and never
      # committed. The host key is pinned so a deploy cannot be MITM'd onto a
      # look-alike host.
      - name: Install SSH key and pin host key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' 'femtomind.duckdns.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPC+13PtpPWLHKw5nKAJnWoTFMZRPKmm+JHkbeUWnqAd' > ~/.ssh/known_hosts

      # The repo nests fitpack-workflow/ and hpc-monitor/ under
      # femtomind-chatgpt-app/, but on the host they are SIBLINGS and mcpo
      # points at the sibling paths. The app rsync therefore excludes them,
      # and they are deployed to their own top-level dirs below. Nothing here
      # uses --delete, so host-only files (auth.db, hpc_tasks.db, runs, logs)
      # are never removed.
      - name: Deploy app, widgets and overlay
        run: |
          rsync -rlDz \
            --exclude '.git' --exclude '.github' --exclude '__pycache__' --exclude '*.pyc' \
            --exclude '.venv' --exclude 'docs' --exclude 'deploy' \
            --exclude 'DEPLOYMENT.md' --exclude 'RECOVERY.md' \
            --exclude 'fitpack-workflow' --exclude 'hpc-monitor' \
            -e "ssh -o StrictHostKeyChecking=yes" \
            ./ ec2-user@femtomind.duckdns.org:/home/ec2-user/femtomind/femtomind-chatgpt-app/

      - name: Deploy fitpack backend (sibling on host)
        run: |
          rsync -rlDz --exclude '__pycache__' --exclude '*.pyc' \
            -e "ssh -o StrictHostKeyChecking=yes" \
            fitpack-workflow/ ec2-user@femtomind.duckdns.org:/home/ec2-user/femtomind/fitpack-workflow/

      - name: Deploy hpc-monitor (sibling on host)
        run: |
          rsync -rlDz --exclude '__pycache__' --exclude '*.pyc' \
            -e "ssh -o StrictHostKeyChecking=yes" \
            hpc-monitor/ ec2-user@femtomind.duckdns.org:/home/ec2-user/femtomind/hpc-monitor/

      # mcpo first, then app. app keeps KillMode=process so a restart does not
      # tear down collaborators' SSH ControlMasters.
      - name: Restart services
        run: |
          ssh -o StrictHostKeyChecking=yes ec2-user@femtomind.duckdns.org \
            "sudo systemctl restart femtomind-mcpo && sleep 2 && sudo systemctl restart femtomind-app \
             && systemctl is-active femtomind-mcpo femtomind-app femtomind-tunnel"

      # The stack returns 200 while being wrong, so check the thing that
      # matters: the OAuth discovery doc is the client's first real read.
      - name: Smoke test (HTTP)
        run: |
          # systemd restart returns as soon as the new process spawns, but
          # uvicorn needs 1-2s more to bind; a curl without retry hits that
          # window with a 502 (observed 2026-09-24). Poll until real 200s.
          code=""
          for i in $(seq 1 20); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 10 \
              https://femtomind.duckdns.org/.well-known/oauth-protected-resource 2>/dev/null || true)
            [ "$code" = "200" ] && break
            sleep 3
          done
          test "$code" = "200" || { echo "smoke test failed: HTTP ${code:-no response}"; exit 1; }
          echo "smoke test OK: HTTP 200"

      # Tool-level smoke test on the host: exercises the MCP surface itself
      # (pure-local tools + validation gate). HPC-backed tools need a live
      # ControlMaster and are covered by tests/mcp_smoke.py run from a
      # connected workstation.
      - name: Smoke test (MCP tool surface)
        run: |
          ssh -o StrictHostKeyChecking=yes ec2-user@femtomind.duckdns.org '
            set -e
            BASE=http://127.0.0.1:8000/fitpack
            # mcpo restarts in the same window as the app; wait until it
            # actually answers before exercising the tool surface.
            for i in $(seq 1 10); do
              curl -fsS -m 5 -X POST $BASE/validation_query \
                -H "Content-Type: application/json" -d "{}" >/dev/null && break
              sleep 3
            done
            curl -fsS -m 20 -X POST $BASE/search_datasets -H "Content-Type: application/json" \
              -d "{\"observable\":\"dy\"}" | python3 -c "import json,sys; d=json.load(sys.stdin); assert \"10001\" in str(d)" \
              && echo "search_datasets OK"
            curl -fsS -m 20 -X POST $BASE/explain_fit_terms -H "Content-Type: application/json" \
              -d "{\"term\":\"chi2/N\"}" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get(\"status\")==\"ok\"" \
              && echo "explain_fit_terms OK"
            curl -fsS -m 20 -X POST $BASE/validation_query -H "Content-Type: application/json" \
              -d "{}" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get(\"ok\") is True" \
              && echo "validation_query OK"
          ' && echo "MCP tool-surface smoke OK"
