name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tool-layer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests (permission policy + validation registry)
        working-directory: fitpack-workflow
        run: |
          python3 path_policy_test.py
          python3 validation_registry_test.py

      - name: Syntax check (tools compile)
        working-directory: fitpack-workflow
        run: |
          python3 -m py_compile server.py campaign_tools.py ssh_runner.py \
            path_policy.py validation_registry.py
          python3 -m py_compile ../femtomind_app.py
